name: platformio
x-podman:
    in_pod: false # We only have a single container, having a cluster/pod is overkill
services:
    base:
        container_name: platformio
        hostname: platformIO
        image: platformio
        # We want interactivity in this container
        stdin_open: true
        tty: true
        
        build:
            context: .
            dockerfile: containerfile

        volumes:
            # We need arbitrary tty access
            # Be sure to add udev rules to allow everyone to rw to the relevant tty files
            #  - A sample udev rule is provided alongside this compose file
            - /dev:/dev:rw
            
            - ${HOME}/Source:/root/Source:rw

        security_opt:
            - label=type:container_runtime_t
